const PEOPLE = [

  { name: 'Len Blavatnik',              nw:  36, cat: 'Industrial',  country: 'UK',      co: 'Access Industries' },

  { name: 'Harold Hamm',                nw:  21, cat: 'Energy',      country: 'USA',     co: 'Continental Resources' },

  { name: 'Stefan Quandt',              nw:  17, cat: 'Automotive',  country: 'Germany', co: 'BMW' },
];

PEOPLE.forEach((p, i) => p.rank = i + 1);

/* ─── Derived stats ─── */
const maxNW = Math.max(...PEOPLE.map(p => p.nw));
const minNW = Math.min(...PEOPLE.map(p => p.nw));
const usedCats = [...new Set(PEOPLE.map(p => p.cat))];

/* ─── Scene setup ─── */
const container = document.getElementById('canvas-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010108);
scene.fog = new THREE.FogExp2(0x010108, 0.0025);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 55, 130);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

/* CSS2D label renderer */
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

/* Orbit controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 500;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.18;
controls.target.set(0, 0, 0);
controls.enablePan = true;
controls.panSpeed = 0.8;
controls.zoomSpeed = 1.2;

/* ─── Glow texture factory ─── */
function makeGlowTexture(color = '#ffffff') {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const center = size / 2;
  const grad = ctx.createRadialGradient(center, center, 0, center, center, center);
  grad.addColorStop(0, color + 'ff');
  grad.addColorStop(0.2, color + 'cc');
  grad.addColorStop(0.5, color + '44');
  grad.addColorStop(1, '#00000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

const glowTextures = {};
for (const [cat, cfg] of Object.entries(CATEGORIES)) {
  glowTextures[cat] = makeGlowTexture(cfg.color);
}

/* ─── Star size scaling (cube-root, then remap) ─── */
function starRadius(nw) {
  const cbMin = Math.cbrt(minNW);
  const cbMax = Math.cbrt(maxNW);
  const t = (Math.cbrt(nw) - cbMin) / (cbMax - cbMin);
  return 0.55 + t * 5.5;
}

/* ─── Galaxy spiral position ─── */
function galaxyPosition(index, total) {
  const i = index + 1;
  if (index === 0) return new THREE.Vector3(0, 0, 0); // richest at centre
  const t = i / total;
  const arms = 3;
  const arm = index % arms;
  const radius = 10 + 70 * Math.pow(t, 0.58);
  const spiralTurns = 2.4;
  const angle = t * spiralTurns * Math.PI * 2 + arm * (Math.PI * 2 / arms);
  const jitterR = (Math.random() - 0.5) * 5 * t;
  const jitterA = (Math.random() - 0.5) * 0.18;
  const x = (radius + jitterR) * Math.cos(angle + jitterA);
  const z = (radius + jitterR) * Math.sin(angle + jitterA);
  const y = (Math.random() - 0.5) * 4 * (1 - t * 0.6);
  return new THREE.Vector3(x, y, z);
}

/* ─── Stars (billionaires) ─── */
const starMeshes = [];
const positions = PEOPLE.map((p, i) => galaxyPosition(i, PEOPLE.length));

// Precompute to make layout deterministic (no random call after seed)
const starGroup = new THREE.Group();
scene.add(starGroup);

PEOPLE.forEach((person, i) => {
  const pos = positions[i];
  const cat = CATEGORIES[person.cat];
  const r = starRadius(person.nw);

  // Core sphere
  const geo = new THREE.SphereGeometry(r * 0.38, 20, 20);
  const mat = new THREE.MeshBasicMaterial({ color: cat.hex });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.userData = { person, index: i, baseRadius: r };
  starGroup.add(mesh);
  starMeshes.push(mesh);

  // Glow sprite
  const spriteMat = new THREE.SpriteMaterial({
    map: glowTextures[person.cat],
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0.85,
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.setScalar(r * 3.2);
  sprite.position.copy(pos);
  starGroup.add(sprite);

  // CSS2D label (always-on for top 12, hidden for rest until hover)
  const div = document.createElement('div');
  div.className = 'star-label';
  div.textContent = person.name;
  div.style.color = cat.color;
  if (i >= 12) div.style.opacity = '0';
  div.dataset.index = i;
  const label = new CSS2DObject(div);
  label.position.set(0, r * 0.6 + 0.5, 0);
  mesh.add(label);

  person._mesh = mesh;
  person._label = div;
});

coreSprite.position.set(0, 0, 0);
scene.add(coreSprite);

/* ─── Background starfield ─── */
(function buildStarfield() {
  const count = 5000;
  const pos = new Float32Array(count * 3);
  const cols = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const radius = 300 + Math.random() * 200;
    pos[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = radius * Math.cos(phi);
    const warm = Math.random();
    cols[i * 3]     = 0.7 + warm * 0.3;
    cols[i * 3 + 1] = 0.75 + (1 - warm) * 0.15;
    cols[i * 3 + 2] = 0.9 + (1 - warm) * 0.1;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.55, sizeAttenuation: true,
    vertexColors: true, transparent: true, opacity: 0.75,
    depthWrite: false,
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* ─── Nebula clouds ─── */
(function buildNebulae() {
  const clouds = [
    { pos: new THREE.Vector3(40, 8, -20),  color: '#2d1060', scale: 55, op: 0.18 },
    { pos: new THREE.Vector3(-35, -5, 30), color: '#0a3060', scale: 48, op: 0.15 },
    { pos: new THREE.Vector3(10, -10, 50), color: '#1a0d3a', scale: 60, op: 0.20 },
    { pos: new THREE.Vector3(-50, 6, -10), color: '#102a20', scale: 50, op: 0.15 },
  ];
  clouds.forEach(c => {
    const tex = makeGlowTexture(c.color);
    const mat = new THREE.SpriteMaterial({
      map: tex, transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false, opacity: c.op,
    });
    const sp = new THREE.Sprite(mat);
    sp.scale.setScalar(c.scale);
    sp.position.copy(c.pos);
    scene.add(sp);
  });
})();

/* ─── Raycasting ─── */
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.5;
const mouse = new THREE.Vector2();
let hoveredIndex = -1;
let selectedIndex = -1;
let isPointerDown = false;
let pointerMoved = false;

function onPointerMove(e) {
  if (isPointerDown) pointerMoved = true;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  updateHover();
}

function updateHover() {
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(starMeshes);
  const newHover = hits.length ? hits[0].object.userData.index : -1;
  if (newHover !== hoveredIndex) {
    if (hoveredIndex >= 0 && hoveredIndex !== selectedIndex) {
      unhighlightStar(hoveredIndex);
    }
    hoveredIndex = newHover;
    if (hoveredIndex >= 0 && hoveredIndex !== selectedIndex) {
      highlightStar(hoveredIndex, false);
    }
    renderer.domElement.style.cursor = newHover >= 0 ? 'pointer' : 'grab';
  }
}

function highlightStar(idx, selected) {
  const p = PEOPLE[idx];
  const mesh = p._mesh;
  mesh.scale.setScalar(selected ? 1.8 : 1.4);
  if (idx >= 12) p._label.style.opacity = '1';
}

function unhighlightStar(idx) {
  const p = PEOPLE[idx];
  p._mesh.scale.setScalar(1);
  if (idx >= 12) p._label.style.opacity = '0';
}

function onPointerDown(e) {
  isPointerDown = true;
  pointerMoved = false;
}

function onPointerUp(e) {
  isPointerDown = false;
  if (!pointerMoved && e.button === 0) {
    if (hoveredIndex >= 0) {
      selectStar(hoveredIndex);
    } else {
      clearSelection();
    }
  }
}

function selectStar(idx) {
  if (selectedIndex >= 0 && selectedIndex !== idx) {
    unhighlightStar(selectedIndex);
  }
  selectedIndex = idx;
  highlightStar(idx, true);
  showInfo(idx);
  flyTo(idx);
  highlightListItem(idx);
}

function clearSelection() {
  if (selectedIndex >= 0) {
    unhighlightStar(selectedIndex);
    selectedIndex = -1;
  }
  hideInfo();
  clearListHighlight();
}

/* ─── Info panel ─── */
const infoPanel = document.getElementById('info-panel');

function showInfo(idx) {
  const p = PEOPLE[idx];
  const cat = CATEGORIES[p.cat];
  document.getElementById('info-rank').textContent = `#${p.rank} of 50`;
  document.getElementById('info-name').textContent = p.name;
  document.getElementById('info-nw').textContent = `$${p.nw}B`;
  document.getElementById('info-nw').style.color = cat.color;
  document.getElementById('info-company').textContent = p.co;
  document.getElementById('info-country').textContent = p.country;
  document.getElementById('info-cat-dot').style.background = cat.color;
  document.getElementById('info-cat-dot').style.boxShadow = `0 0 6px ${cat.color}`;
  document.getElementById('info-cat-text').textContent = p.cat;
  infoPanel.classList.add('visible');
}

function hideInfo() {
  infoPanel.classList.remove('visible');
}

document.getElementById('info-close').addEventListener('click', clearSelection);

/* ─── Camera fly-to ─── */
let flyTarget = null;
let flyStart = null;
let flyProgress = 0;
let flyDuration = 1.4;

function flyTo(idx) {
  const pos = positions[idx];
  const r = PEOPLE[idx]._mesh.userData.baseRadius;
  const dist = Math.max(r * 6, 18);
  const dir = camera.position.clone().sub(pos).normalize();
  flyTarget = {
    camPos: pos.clone().add(dir.multiplyScalar(dist)),
    ctrlTarget: pos.clone(),
  };
  flyStart = {
    camPos: camera.position.clone(),
    ctrlTarget: controls.target.clone(),
  };
  flyProgress = 0;
  controls.autoRotate = false;
}

function updateFly(dt) {
  if (!flyTarget) return;
  flyProgress += dt / flyDuration;
  const t = easeInOut(Math.min(flyProgress, 1));
  camera.position.lerpVectors(flyStart.camPos, flyTarget.camPos, t);
  controls.target.lerpVectors(flyStart.ctrlTarget, flyTarget.ctrlTarget, t);
  if (flyProgress >= 1) flyTarget = null;
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

/* ─── Legend ─── */
(function buildLegend() {
  const rows = document.getElementById('legend-rows');
  usedCats.forEach(cat => {
    const cfg = CATEGORIES[cat];
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<div class="legend-dot" style="background:${cfg.color};box-shadow:0 0 6px ${cfg.color}80"></div><span class="legend-label">${cat}</span>`;
    rows.appendChild(row);
  });
})();

/* ─── Sidebar list ─── */
const listContainer = document.getElementById('list-container');
const searchInput = document.getElementById('search');
let listItems = [];

function buildList(filter = '') {
  listContainer.innerHTML = '';
  listItems = [];
  const q = filter.toLowerCase();
  PEOPLE.filter(p => p.name.toLowerCase().includes(q)).forEach(p => {
    const cat = CATEGORIES[p.cat];
    const item = document.createElement('div');
    item.className = 'list-item';
    item.dataset.index = p.rank - 1;
    item.innerHTML = `
      <span class="list-rank">${p.rank}</span>
      <span class="list-dot" style="background:${cat.color};box-shadow:0 0 5px ${cat.color}80;color:${cat.color}"></span>
      <span class="list-name">${p.name}</span>
      <span class="list-nw">$${p.nw}B</span>
    `;
    item.addEventListener('click', () => selectStar(p.rank - 1));
    listContainer.appendChild(item);
    listItems.push(item);
  });
}

function highlightListItem(idx) {
  listItems.forEach(el => el.classList.remove('active'));
  const match = listItems.find(el => parseInt(el.dataset.index) === idx);
  if (match) {
    match.classList.add('active');
    match.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function clearListHighlight() {
  listItems.forEach(el => el.classList.remove('active'));
}

buildList();
searchInput.addEventListener('input', e => buildList(e.target.value));

/* ─── Sidebar toggle ─── */
const sidebar = document.getElementById('sidebar');
const toggleBtn = document.getElementById('sidebar-toggle');
let sidebarOpen = true;

toggleBtn.addEventListener('click', () => {
  sidebarOpen = !sidebarOpen;
  sidebar.classList.toggle('collapsed', !sidebarOpen);
  toggleBtn.classList.toggle('open', sidebarOpen);
  toggleBtn.style.right = sidebarOpen ? '240px' : '0';
  toggleBtn.textContent = sidebarOpen ? 'Hide' : 'List';
  // reflow disclaimer
  document.getElementById('disclaimer').style.right = sidebarOpen ? '250px' : '10px';
});

/* ─── Resize ─── */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

/* ─── Event listeners ─── */
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointerup', onPointerUp);
renderer.domElement.style.cursor = 'grab';

/* ─── Animate ─── */
let prevTime = performance.now();
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - prevTime) / 1000;
  prevTime = now;

  controls.update();
  updateFly(dt);

  // Subtle star pulse
  const t = clock.getElapsedTime();
  starMeshes.forEach((mesh, i) => {
    if (i === selectedIndex || i === hoveredIndex) return;
    const pulse = 1 + 0.04 * Math.sin(t * 1.2 + i * 0.9);
    mesh.scale.setScalar(pulse);
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

animate();
</script>
