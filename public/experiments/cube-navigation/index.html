<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Navigation</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#F5C84B; --dim:#7E89B0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#000;color:#fff;font-family:'Space Grotesk',sans-serif;overflow:hidden}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;cursor:grab;touch-action:none}
  canvas#scene.grabbing{cursor:grabbing}
  .hud{position:fixed;z-index:2;left:0;right:0;top:0;padding:22px 24px;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.75), transparent)}
  .hud .eyebrow{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  .hud h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(20px,3vw,32px);line-height:1}
  .hud p{color:var(--dim);font-size:12px;margin-top:6px;max-width:42ch;line-height:1.5}
  .hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;
    font-size:11px;font-weight:400;letter-spacing:0.2em;text-transform:uppercase;color:#666;text-align:center}
  .hint b{color:#fff;font-weight:400}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <div class="eyebrow">Spatial · WebGL</div>
  <h1>Cube Navigation</h1>
  <p>A navigation surface as a 3D object — drag to spin, or tap a face to snap it forward.</p>
</div>
<div class="hint" id="hint">Drag to rotate · tap a face to focus</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const LETTERS = ['A','B','C','D','E','F'];   // order: px, nx, py, ny, pz, nz
// snap targets: bring each face normal toward the camera (+Z)
const targets = [
  new THREE.Euler(0, -Math.PI/2, 0),   // A  right
  new THREE.Euler(0,  Math.PI/2, 0),   // B  left
  new THREE.Euler(Math.PI/2, 0, 0),    // C  top
  new THREE.Euler(-Math.PI/2, 0, 0),   // D  bottom
  new THREE.Euler(0, 0, 0),            // E  front
  new THREE.Euler(0, Math.PI, 0),      // F  back
].map(e => new THREE.Quaternion().setFromEuler(e));

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('scene');
const hintEl = document.getElementById('hint');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio||1));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0,0,5.2);

// face textures — black face, white border, big letter
function faceTexture(letter){
  const s=512, c=document.createElement('canvas'); c.width=c.height=s;
  const x=c.getContext('2d');
  x.fillStyle='#202024'; x.fillRect(0,0,s,s);
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
  x.font='200 132px "Helvetica Neue", Arial, sans-serif';
  x.fillText(letter, s/2, s/2+4);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
const materials = LETTERS.map(l => new THREE.MeshStandardMaterial({map:faceTexture(l), roughness:0.45, metalness:0.4}));
const cube = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), materials);
scene.add(cube);

// lighting — gives the cube real 3D shading
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.05); key.position.set(4,5,6); scene.add(key);
const rim = new THREE.PointLight(0x88aaff, 0.6, 40); rim.position.set(-7,-2,4); scene.add(rim);
const warm = new THREE.PointLight(0xF5C84B, 0.45, 40); warm.position.set(6,-4,2); scene.add(warm);

// white edges
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(cube.geometry),
  new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.22})
);
cube.add(edges);

// interaction
const ray = new THREE.Raycaster();
let dragging=false, moved=false, lastX=0, lastY=0, focusIdx=-1, hoverIdx=-1;
const autoVel = 0.0038;

function setHint(i){
  hintEl.innerHTML = i<0 ? 'Drag to rotate · tap a face to focus' : `Face <b>${LETTERS[i]}</b> · tap empty space to release`;
}
function pointer(e){ const r=cv.getBoundingClientRect(); return {x:((e.clientX-r.left)/r.width)*2-1, y:-((e.clientY-r.top)/r.height)*2+1}; }
function pick(e){
  const p=pointer(e); ray.setFromCamera(new THREE.Vector2(p.x,p.y), camera);
  const hit=ray.intersectObject(cube,false)[0];
  return hit && hit.face ? hit.face.materialIndex : -1;
}
cv.addEventListener('pointerdown', e=>{ dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY; cv.classList.add('grabbing'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    if(Math.abs(dx)+Math.abs(dy)>2){ moved=true; if(focusIdx>=0){ focusIdx=-1; setHint(-1); } }
    const qx=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), dx*0.006);
    const qy=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), dy*0.006);
    cube.quaternion.premultiply(qx).premultiply(qy);
  } else {
    const i=pick(e);
    if(i!==hoverIdx){
      if(hoverIdx>=0) materials[hoverIdx].emissive.setHex(0x000000);
      hoverIdx=i; cv.style.cursor = i>=0?'pointer':'grab';
      if(i>=0) materials[i].emissive.setHex(0x2a2a30);
    }
  }
});
cv.addEventListener('pointerup', e=>{
  dragging=false; cv.classList.remove('grabbing');
  if(!moved){ const i=pick(e); if(i>=0 && i!==focusIdx){ focusIdx=i; setHint(i); } else { focusIdx=-1; setHint(-1); } }
});
cv.addEventListener('pointerleave', ()=>{ if(hoverIdx>=0){ materials[hoverIdx].emissive.setHex(0x000000); hoverIdx=-1; } });

function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function animate(){
  if(focusIdx>=0){
    cube.quaternion.slerp(targets[focusIdx], 0.12);
  } else if(!dragging && !reduce){
    const qy=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), autoVel);
    const qx=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), autoVel*0.4);
    cube.quaternion.premultiply(qy).premultiply(qx);
  }
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
